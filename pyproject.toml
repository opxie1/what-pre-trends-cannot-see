[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "did-measurement"
version = "1.0.0"
description = "Falsification tests for treatment induced recording change with few clusters"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ethan Xie", email = "ethanxie@udel.edu" }]
keywords = [
    "difference-in-differences",
    "measurement error",
    "randomization inference",
    "cluster robust inference",
    "falsification tests",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
]

[project.optional-dependencies]
# only the replication scripts need these; the method itself does not
replication = ["matplotlib>=3.8", "statsmodels>=0.14"]

[project.urls]
Repository = "https://github.com/opxie1/what-pre-trends-cannot-see"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
